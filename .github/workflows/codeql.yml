# CodeQL security analysis of the C++ code (results in the repository's Security tab).
# Manual build mode: CodeQL observes the same MSBuild build as the Build workflow.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual

      - uses: microsoft/setup-msbuild@v3

      - name: Build (Release x64)
        run: msbuild PeripheralBatteryPlugin.sln /p:Configuration=Release /p:Platform=x64 /m /nologo /v:minimal

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp
